name: Build

on:
  workflow_call:
    inputs:
      cache-key:
        description: Cache key of node_modules
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build, package contents and Storybook
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Restore node_modules
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: ${{ inputs.cache-key }}
          fail-on-cache-miss: true

      - name: Build packages
        run: yarn build

      - name: Component exports match the folders
        run: node packages/ui/scripts/exports.ts

      - name: Package contents and manifest (yarn pack)
        run: yarn pack:check

      - name: Build Storybook
        run: yarn build-storybook
        env:
          STORYBOOK_DISABLE_TELEMETRY: '1'

  changeset:
    name: Changeset for changed packages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Restore node_modules
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: ${{ inputs.cache-key }}
          fail-on-cache-miss: true

      # A release PR (yarn changeset version output) consumes the changesets on purpose.
      - name: Changeset status
        run: |
          changed=$(git diff --name-only "origin/${BASE_REF}...HEAD")
          deleted=$(git diff --name-only --diff-filter=D "origin/${BASE_REF}...HEAD" -- '.changeset/*.md')
          if [ -n "${deleted}" ] && printf '%s\n' "${changed}" | grep -qE '^packages/[^/]+/CHANGELOG\.md$' \
            && ! printf '%s\n' "${changed}" | grep -vqE '^(\.changeset/[^/]+\.md|packages/[^/]+/(package\.json|CHANGELOG\.md))$'; then
            echo "::notice::Release PR (changeset version output): changeset check skipped."
            exit 0
          fi
          yarn changeset status --since="origin/${BASE_REF}"
        env:
          BASE_REF: ${{ github.base_ref }}
